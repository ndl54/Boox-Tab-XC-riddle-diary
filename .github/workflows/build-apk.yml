name: Build signed APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit selected when Run workflow was clicked
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Prepare stable signing key
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: python3 scripts/prepare-signing.py

      - name: Test conversations and Codex protocol
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk'

      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/boox-signing"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: boox-riddle-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
