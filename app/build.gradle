plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.billtt.riddle'
    compileSdk 34

    defaultConfig {
        applicationId 'com.billtt.riddle'
        minSdk 28            // BOOX Note X2 出厂为 Android 11 (API 30)
        targetSdk 34
        versionCode 3
        versionName '0.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        jniLibs {
            // onyxsdk-pen 与其依赖 mmkv 都自带 libc++_shared.so
            pickFirsts += ['lib/*/libc++_shared.so']
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/INDEX.LIST',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'META-INF/*.kotlin_module',
                'META-INF/versions/**',
            ]
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    // Onyx BOOX SDK：低延迟原始笔迹输入 + 电子墨水屏刷新控制。
    // 用 Boox-EinkDraw 实测零延迟的整套本地库（勿升 maven 新版）：
    // pen/base/device 的 AAR 只是壳，硬件快速笔迹引擎 NeoPenNative 等真身类
    // 在 onyxsdk-pen-native-classes.jar（EinkDraw 作者从设备 knote2 APK 提取）。
    // maven 1.5.4 缺这些类 → 渲染层退回慢速软件路径，这是"不跟手"的病根。
    implementation files('libs/onyxsdk-base-1.8.4.aar')
    implementation files('libs/onyxsdk-pen-1.5.2.aar')
    implementation files('libs/onyxsdk-device-1.3.3.aar')
    implementation files('libs/onyxsdk-pen-native-classes.jar')
    // base-1.8.4 的 data.note.TouchPoint 继承 base.data.TouchPoint，后者只在 baselite 里
    implementation 'com.onyx.android.sdk:onyxsdk-baselite:1.1.1'

    // Onyx SDK 运行时需要（RxManager 两代都用到；hiddenapi 反射放行）
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'io.reactivex:rxjava:1.3.8'
    implementation 'io.reactivex:rxandroid:1.2.1'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'

    // Anthropic 官方 Java SDK（Claude API，视觉识别手写内容）
    implementation 'com.anthropic:anthropic-java:2.34.0'

    // OpenAI 后端走 Chat Completions（兼容任意 OpenAI-compatible 接口）
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
